# MeuNegocio360 - infraestrutura local de desenvolvimento
#
# Uso:
#   cp .env.example .env        # preencha as senhas (o arquivo .env nunca é versionado)
#   docker compose up -d --build  # sobe o PostgreSQL e o backend do Núcleo
#   docker compose down         # para os contêineres (mantém os dados)
#   docker compose down -v      # para e APAGA os dados locais do banco
#
# Arquitetura de microsserviços: cada serviço tem o seu próprio banco (RNF-090).
# Hoje só o Núcleo existe. Quando Serviços e Suprimentos forem implementados,
# cada um acrescenta aqui o seu próprio serviço de banco (ex.: servicos-db,
# suprimentos-db), com volume, porta e credenciais próprios.

name: meunegocio360

services:
  core-db:
    image: postgres:18
    container_name: meunegocio360-core-db
    restart: unless-stopped
    environment:
      # O usuário criado aqui é o mesmo usado pela aplicação (dono do banco do Núcleo).
      POSTGRES_DB: ${CORE_DB_NAME:-meunegocio360_core}
      POSTGRES_USER: ${DB_USER:-meunegocio360}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Defina DB_PASSWORD no arquivo .env}
      TZ: UTC
      PGTZ: UTC
    ports:
      # Exposto apenas em localhost: o banco não fica acessível pela rede.
      - "127.0.0.1:${CORE_DB_PORT:-5432}:5432"
    volumes:
      # A partir do PostgreSQL 18, a imagem oficial guarda os dados em
      # /var/lib/postgresql/<versão>/docker; monta-se o diretório pai.
      - core-db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  core-api:
    build: ./meunegocio360-core
    container_name: meunegocio360-core-api
    restart: unless-stopped
    # Mesmas variáveis do .env da raiz; só o endereço do banco muda (nome do serviço na rede do compose).
    env_file: .env
    environment:
      DB_URL: postgresql+psycopg://core-db:5432/${CORE_DB_NAME:-meunegocio360_core}
    depends_on:
      core-db:
        condition: service_healthy
    ports:
      - "127.0.0.1:${CORE_API_PORT:-8080}:8080"

volumes:
  core-db-data:
